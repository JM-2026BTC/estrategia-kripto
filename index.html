<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Genisys — Calculadora</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    padding: 20px;
    line-height: 1.6;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { color: #58a6ff; font-size: 28px; margin-bottom: 6px; letter-spacing: 1px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 24px; }
  .layout { display: flex; flex-direction: column; gap: 16px; }
  @media (min-width: 900px) {
    .layout { flex-direction: row; align-items: flex-start; }
    .col-formulario { flex: 2; min-width: 0; }
    .col-paneles { flex: 1; min-width: 300px; max-width: 380px; }
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 16px; color: #58a6ff; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 5px; margin-top: 12px; }
  input, select {
    width: 100%;
    padding: 9px 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: #58a6ff; }
  input:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    width: 100%;
    padding: 12px;
    background: #238636;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 18px;
  }
  button:hover { background: #2ea043; }

  .entrada-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }
  .entrada-row label {
    margin: 0;
    min-width: 30px;
    font-size: 13px;
    color: #8b949e;
  }
  .input-chico {
    width: 130px !important;
    flex-shrink: 0;
  }
  .resumen-entrada {
    font-size: 11px;
    color: #8b949e;
    margin-left: auto;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .resumen-entrada .prom { color: #58a6ff; }
  .resumen-entrada .liq { color: #f85149; }
  .resumen-total {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #21262d;
    font-size: 13px;
    color: #8b949e;
  }
  .resumen-total strong { color: #58a6ff; }

  .resultado { display: none; }
  .resultado.activo { display: block; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .destacado { color: #58a6ff; font-weight: 600; }
  .verde { color: #3fb950; }
  .rojo { color: #f85149; }
  .amarillo { color: #d29922; }
  .alerta {
    background: #2d1b1b;
    border-left: 3px solid #f85149;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 13px;
    margin-top: 12px;
  }
  .ok {
    background: #1b2d1b;
    border-left: 3px solid #3fb950;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 13px;
    margin-top: 12px;
  }
  .info {
    background: #1b2530;
    border-left: 3px solid #58a6ff;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 13px;
    margin-top: 12px;
  }
  .footer { text-align: center; color: #484f58; font-size: 11px; margin-top: 30px; }
  .evento { padding: 8px 0; border-bottom: 1px solid #21262d; }
  .evento:last-child { border-bottom: none; }
  .evento-fecha { color: #8b949e; font-size: 12px; }
  .evento-nombre { color: #c9d1d9; font-size: 13px; margin-top: 2px; }
  .rsi-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #21262d; }
  .rsi-row:last-child { border-bottom: none; }
  .rsi-tf { color: #8b949e; font-size: 13px; }
  .rsi-val { font-weight: 600; font-size: 14px; }
  .fvg-confluencia {
    background: #1b2530;
    border-left: 3px solid #d29922;
    padding: 8px 12px;
    border-radius: 4px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .fvg-tf-header {
    color: #58a6ff;
    font-size: 12px;
    font-weight: 600;
    margin-top: 12px;
    margin-bottom: 6px;
    border-bottom: 1px solid #21262d;
    padding-bottom: 4px;
  }
  .fvg-row {
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px solid #21262d;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .fvg-row:last-child { border-bottom: none; }
  .fvg-tipo { font-size: 11px; padding: 1px 6px; border-radius: 3px; }
  .fvg-tipo.alcista { background: #1b2d1b; color: #3fb950; }
  .fvg-tipo.bajista { background: #2d1b1b; color: #f85149; }
  .fvg-zona { color: #8b949e; font-size: 11px; }
  .fvg-precio { font-weight: 600; color: #c9d1d9; font-size: 13px; }
</style>
</head>
<body>
<div class="container">

  <h1>⚡ GENISYS</h1>
  <p class="sub">Sistema de cálculo para la Estrategia Kripto — v4.1</p>

  <div class="layout">

    <div class="col-formulario">

      <div class="card" id="formulario">
        <h2>Datos de la operación</h2>

        <label>Modo de trabajo</label>
        <select id="modo" onchange="cambiarModo()">
          <option value="H" selected>Híbrido (H) — el sistema sugiere, vos decidís</option>
          <option value="A">Automático (A) — el sistema calcula E2 y E3</option>
        </select>

        <label>Cripto a analizar (para RSI y FVG)</label>
        <select id="cripto" onchange="cambiarCripto()">
          <option value="BTCUSDT">BTC — Bitcoin</option>
          <option value="HYPEUSDT">HYPE — Hyperliquid</option>
          <option value="DOGEUSDT">DOGE — Dogecoin</option>
          <option value="PEPEUSDT">PEPE — Pepe</option>
        </select>

        <div class="row">
          <div>
            <label>Dirección</label>
            <select id="direccion">
              <option value="SHORT">SHORT</option>
              <option value="LONG">LONG</option>
            </select>
          </div>
          <div>
            <label>Apalancamiento</label>
            <select id="apalancamiento" onchange="calcularParcial()">
              <option value="10">x10 (liq. 9,5%)</option>
              <option value="12">x12 (liq. 7,9%)</option>
              <option value="15">x15 (liq. 6,25%)</option>
              <option value="20">x20 (liq. 4,5%)</option>
              <option value="30">x30 (liq. 2,8%)</option>
            </select>
          </div>
        </div>

        <label>Monto total de la operatoria (USD)</label>
        <input type="number" id="monto" placeholder="270" step="any" oninput="calcularParcial()">

        <label>Precios de entrada</label>

        <div class="entrada-row">
          <label>E1:</label>
          <input type="number" id="e1" class="input-chico" placeholder="83870" step="any" oninput="calcularParcial()">
          <span id="e1-resumen" class="resumen-entrada"></span>
        </div>

        <div class="entrada-row">
          <label>E2:</label>
          <input type="number" id="e2" class="input-chico" placeholder="85966" step="any" oninput="calcularParcial()">
          <span id="e2-resumen" class="resumen-entrada"></span>
        </div>

        <div class="entrada-row">
          <label>E3:</label>
          <input type="number" id="e3" class="input-chico" placeholder="88116" step="any" oninput="calcularParcial()">
          <span id="e3-resumen" class="resumen-entrada"></span>
        </div>

        <div class="row">
          <div>
            <label>% Entrada 1</label>
            <input type="number" id="p1" value="20" step="any" oninput="calcularParcial()">
          </div>
          <div>
            <label>% Entrada 2</label>
            <input type="number" id="p2" value="30" step="any" oninput="calcularParcial()">
          </div>
          <div>
            <label>% Entrada 3</label>
            <input type="number" id="p3" value="50" step="any" oninput="calcularParcial()">
          </div>
        </div>

        <label>Escalonamiento (%)</label>
        <input type="number" id="escalonamiento" value="2.5" step="any" onchange="calcularAuto()">

        <label>SL manual (% desde el promedio, opcional)</label>
        <input type="number" id="sl" placeholder="2" step="any">

        <div id="resumen-total" class="resumen-total"></div>

        <button onclick="calcular()">Calcular plan completo</button>
      </div>

      <div id="resultado" class="resultado"></div>

    </div>

    <div class="col-paneles">

      <div class="card" id="fvg-panel" style="display:none;">
        <h2>📊 FVG — <span id="fvg-cripto-nombre">BTC</span></h2>
        <div id="fvg-content"></div>
      </div>

      <div class="card" id="rsi-panel" style="display:none;">
        <h2>📈 RSI — <span id="rsi-cripto-nombre">BTC</span></h2>
        <div id="rsi-content"></div>
      </div>

      <div class="card" id="sentiment-panel" style="display:none;">
        <h2>📊 Sentimiento del Mercado</h2>
        <div id="sentiment-content"></div>
      </div>

      <div class="card" id="eventos-panel" style="display:none;">
        <h2>📅 Eventos Económicos</h2>
        <div id="eventos-content"></div>
      </div>

    </div>

  </div>

  <p class="footer">GENISYS v4.1 — Herramienta educativa. No es recomendación financiera.</p>
</div>

<script>
const LIQ = { 10: 9.5, 12: 7.9, 15: 6.25, 20: 4.5, 30: 2.8 };
const ESC_SUGERIDO = { 10: 2.5, 12: 2.0, 15: 1.5, 20: 1.0, 30: 0.6 };
const NOMBRES = { BTCUSDT: 'BTC', HYPEUSDT: 'HYPE', DOGEUSDT: 'DOGE', PEPEUSDT: 'PEPE' };
const DECIMALES = { BTCUSDT: 2, HYPEUSDT: 3, DOGEUSDT: 5, PEPEUSDT: 10 };

let rsiDataGlobal = null;
let fvgDataGlobal = null;

function fmt(n, dec = 2) {
  if (isNaN(n) || n === null || n === undefined) return '—';
  return n.toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function fmtPrecio(precio, cripto) {
  const dec = DECIMALES[cripto] || 2;
  return precio.toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function colorRSI(valor) {
  if (valor === null || valor === undefined) return '#8b949e';
  if (valor >= 70) return '#f85149';
  if (valor <= 30) return '#3fb950';
  return '#d29922';
}

function etiquetaRSI(valor) {
  if (valor === null || valor === undefined) return '';
  if (valor >= 70) return 'Sobrecompra';
  if (valor <= 30) return 'Sobreventa';
  return 'Neutral';
}

function cambiarCripto() {
  cargarRSI();
  cargarFVG();
}

function cambiarModo() {
  const modo = document.getElementById('modo').value;
  const e2 = document.getElementById('e2');
  const e3 = document.getElementById('e3');

  if (modo === 'A') {
    e2.disabled = true;
    e3.disabled = true;

    // Solo calcular si ya hay E1 y monto
    const e1 = parseFloat(document.getElementById('e1').value);
    const monto = parseFloat(document.getElementById('monto').value);

    if (!e1 || !monto || e1 <= 0 || monto <= 0) {
      // No calcular nada, esperar a que cargue los datos
      e2.value = '';
      e3.value = '';
      calcularParcial();
      return;
    }

    calcularAuto();
  } else {
    e2.disabled = false;
    e3.disabled = false;
  }
  calcularParcial();
}

function actualizarSugeridos() {
  const apal = parseInt(document.getElementById('apalancamiento').value);
  document.getElementById('escalonamiento').value = ESC_SUGERIDO[apal];
  calcularAuto();
}

function calcularAuto() {
  const modo = document.getElementById('modo').value;
  if (modo !== 'A') return;
  const dir = document.getElementById('direccion').value;
  const e1 = parseFloat(document.getElementById('e1').value);
  const esc = parseFloat(document.getElementById('escalonamiento').value) || 2.5;
  const monto = parseFloat(document.getElementById('monto').value);

  if (!e1 || e1 <= 0) return;
  if (!monto || monto <= 0) return;

  const factor = dir === 'SHORT' ? (1 + esc / 100) : (1 - esc / 100);
  const e2 = e1 * factor;
  const e3 = e2 * factor;
  document.getElementById('e2').value = e2.toFixed(2);
  document.getElementById('e3').value = e3.toFixed(2);
  calcularParcial();
}

function calcularParcial() {
  const dir = document.getElementById('direccion').value;
  const apal = parseInt(document.getElementById('apalancamiento').value);
  const monto = parseFloat(document.getElementById('monto').value) || 0;
  const liqPct = LIQ[apal] || 9.5;

  const e1 = parseFloat(document.getElementById('e1').value);
  const e2 = parseFloat(document.getElementById('e2').value);
  const e3 = parseFloat(document.getElementById('e3').value);
  const p1 = parseFloat(document.getElementById('p1').value) || 0;
  const p2 = parseFloat(document.getElementById('p2').value) || 0;
  const p3 = parseFloat(document.getElementById('p3').value) || 0;

  const res1 = document.getElementById('e1-resumen');
  if (e1 && e1 > 0) {
    const liq1 = dir === 'SHORT' ? e1 * (1 + liqPct / 100) : e1 * (1 - liqPct / 100);
    res1.innerHTML = `<span class="prom">Prom ${fmt(e1)}</span> | <span class="liq">Liq ${fmt(liq1)}</span>`;
  } else {
    res1.innerHTML = '';
  }

  const res2 = document.getElementById('e2-resumen');
  if (e1 && e2 && p1 && p2) {
    const totalPct = p1 + p2;
    const prom2 = (e1 * p1 + e2 * p2) / totalPct;
    const liq2 = dir === 'SHORT' ? prom2 * (1 + liqPct / 100) : prom2 * (1 - liqPct / 100);
    res2.innerHTML = `<span class="prom">Prom ${fmt(prom2)}</span> | <span class="liq">Liq ${fmt(liq2)}</span>`;
  } else {
    res2.innerHTML = '';
  }

  const res3 = document.getElementById('e3-resumen');
  if (e1 && e2 && e3 && p1 && p2 && p3) {
    const totalPct = p1 + p2 + p3;
    const prom3 = (e1 * p1 + e2 * p2 + e3 * p3) / totalPct;
    const liq3 = dir === 'SHORT' ? prom3 * (1 + liqPct / 100) : prom3 * (1 - liqPct / 100);
    res3.innerHTML = `<span class="prom">Prom ${fmt(prom3)}</span> | <span class="liq">Liq ${fmt(liq3)}</span>`;
  } else {
    res3.innerHTML = '';
  }

  const resumenTotal = document.getElementById('resumen-total');
  if (monto > 0 && (e1 || e2 || e3)) {
    let montoInvertido = 0;
    let nominal = 0;
    let entradasActivas = 0;

    if (e1 && p1) { montoInvertido += monto * (p1 / 100); entradasActivas++; }
    if (e2 && p2) { montoInvertido += monto * (p2 / 100); entradasActivas++; }
    if (e3 && p3) { montoInvertido += monto * (p3 / 100); entradasActivas++; }

    nominal = montoInvertido * apal;

    resumenTotal.innerHTML = `Monto invertido: <strong>$${fmt(montoInvertido)}</strong> | Nominal: <strong>$${fmt(nominal, 0)}</strong> | Entradas activas: <strong>${entradasActivas}/3</strong>`;
  } else {
    resumenTotal.innerHTML = '';
  }
}

function calcular() {
  const modo = document.getElementById('modo').value;
  const dir = document.getElementById('direccion').value;
  const apal = parseInt(document.getElementById('apalancamiento').value);
  const monto = parseFloat(document.getElementById('monto').value);
  const e1 = parseFloat(document.getElementById('e1').value);
  const e2 = parseFloat(document.getElementById('e2').value);
  const e3 = parseFloat(document.getElementById('e3').value);
  const p1 = parseFloat(document.getElementById('p1').value);
  const p2 = parseFloat(document.getElementById('p2').value);
  const p3 = parseFloat(document.getElementById('p3').value);
  const slInput = document.getElementById('sl').value;

  if (!monto || monto <= 0) return alert('Monto total inválido');
  if (!e1 || e1 <= 0) return alert('Precio Entrada 1 inválido');
  if ((e2 && !p2) || (!e2 && p2)) return alert('Entrada 2 incoherente: precio y % deben ir juntos');
  if ((e3 && !p3) || (!e3 && p3)) return alert('Entrada 3 incoherente: precio y % deben ir juntos');

  const entradas = [{ precio: e1, pct: p1, nombre: 'Entrada 1' }];
  if (e2 && p2) entradas.push({ precio: e2, pct: p2, nombre: 'Entrada 2' });
  if (e3 && p3) entradas.push({ precio: e3, pct: p3, nombre: 'Entrada 3' });

  for (let i = 0; i < entradas.length; i++) {
    const pct = entradas[i].pct;
    if (isNaN(pct) || pct <= 0 || pct > 100) {
      return alert(`⚠️ ${entradas[i].nombre}: el % debe ser mayor a 0 y menor o igual a 100.\nValor actual: ${pct}%`);
    }
  }

  const totalPct = entradas.reduce((s, e) => s + e.pct, 0);
  if (Math.abs(totalPct - 100) > 0.01) {
    return alert(`⚠️ Los % de entrada deben sumar 100%.\nSuma actual: ${totalPct}%`);
  }

  const nominalTotal = monto * apal;
  entradas.forEach(e => {
    e.montoReal = monto * (e.pct / 100);
    e.nominal = e.montoReal * apal;
  });

  let suma = 0, pesos = 0;
  entradas.forEach(e => { suma += e.precio * e.nominal; pesos += e.nominal; });
  const promedio = suma / pesos;

  const liqPct = LIQ[apal];
  const liquidacion = dir === 'SHORT' ? promedio * (1 + liqPct / 100) : promedio * (1 - liqPct / 100);

  let sl = null;
  if (slInput && parseFloat(slInput) !== 0) {
    const slPct = Math.abs(parseFloat(slInput));
    sl = dir === 'SHORT' ? promedio * (1 + slPct / 100) : promedio * (1 - slPct / 100);
  }

  const perdidaLiq = Math.abs(liquidacion - promedio) / promedio * nominalTotal;
  const perdidaLiqPct = (perdidaLiq / monto) * 100;

  let perdidaSL = null, perdidaSLPct = null;
  if (sl) {
    perdidaSL = Math.abs(sl - promedio) / promedio * nominalTotal;
    perdidaSLPct = (perdidaSL / monto) * 100;
  }

  const ultima = entradas[entradas.length - 1];
  const distUltimaProm = (promedio - ultima.precio) / ultima.precio * 100;
  const distUltimaLiq = (liquidacion - ultima.precio) / ultima.precio * 100;
  const distPrimeraLiq = (liquidacion - entradas[0].precio) / entradas[0].precio * 100;

  let slCoherente = true;
  if (sl) {
    if (dir === 'SHORT' && sl < ultima.precio) slCoherente = false;
    if (dir === 'LONG' && sl > ultima.precio) slCoherente = false;
  }

  let html = '';
  html += `<div class="card"><h2>⚙️ Modo de trabajo</h2>`;
  if (modo === 'A') {
    html += `<div class="info">Modo <strong>Automático (A)</strong>: E2 y E3 calculadas por el sistema con escalonamiento ${fmt(parseFloat(document.getElementById('escalonamiento').value))}%.</div>`;
  } else {
    html += `<div class="info">Modo <strong>Híbrido (H)</strong>: E2 y E3 cargadas manualmente.</div>`;
  }
  html += `</div>`;

  html += `<div class="card"><h2>🧮 Entradas</h2><table>
    <tr><th>Entrada</th><th>%</th><th>Monto real</th><th>Nominal</th><th>Precio</th></tr>`;
  entradas.forEach((e, i) => {
    html += `<tr><td>${i + 1}</td><td class="num">${e.pct}%</td><td class="num">$${fmt(e.montoReal)}</td><td class="num">$${fmt(e.nominal, 0)}</td><td class="num">${fmt(e.precio)}</td></tr>`;
  });
  html += `<tr style="font-weight:600;color:#58a6ff"><td>Total</td><td class="num">100%</td><td class="num">$${fmt(monto)}</td><td class="num">$${fmt(nominalTotal, 0)}</td><td>—</td></tr></table></div>`;

  html += `<div class="card"><h2>➡️ Niveles clave</h2><table>
    <tr><th>Concepto</th><th class="num">Valor</th></tr>
    <tr><td>Precio promedio</td><td class="num destacado">${fmt(promedio)}</td></tr>
    <tr><td>Liquidación (${liqPct}%)</td><td class="num rojo">${fmt(liquidacion)}</td></tr>`;
  if (sl) html += `<tr><td>SL manual</td><td class="num amarillo">${fmt(sl)}</td></tr>`;
  html += `</table></div>`;

  html += `<div class="card"><h2>📏 Distancias</h2><table>
    <tr><th>Distancia</th><th class="num">Valor</th></tr>
    <tr><td>Última entrada → promedio</td><td class="num">${distUltimaProm >= 0 ? '+' : ''}${fmt(distUltimaProm)}%</td></tr>
    <tr><td>Última entrada → liquidación</td><td class="num">${distUltimaLiq >= 0 ? '+' : ''}${fmt(distUltimaLiq)}%</td></tr>
    <tr><td>Primera entrada → liquidación</td><td class="num">${distPrimeraLiq >= 0 ? '+' : ''}${fmt(distPrimeraLiq)}%</td></tr>
    <tr><td>Promedio vs. última recompra</td><td class="num">${fmt(distUltimaProm)}%</td></tr>
  </table></div>`;

  html += `<div class="card"><h2>💀 Riesgo</h2><table>
    <tr><th>Escenario</th><th class="num">Pérdida</th><th class="num">% monto</th></tr>
    <tr><td>Liquidación (${fmt(liquidacion)})</td><td class="num rojo">-$${fmt(perdidaLiq)}</td><td class="num rojo">-${fmt(perdidaLiqPct)}%</td></tr>`;
  if (sl) html += `<tr><td>SL manual (${fmt(sl)})</td><td class="num amarillo">-$${fmt(perdidaSL)}</td><td class="num amarillo">-${fmt(perdidaSLPct)}%</td></tr>`;
  html += `</table></div>`;

  html += `<div class="card"><h2>⚠️ Observaciones</h2>`;
  if (sl && !slCoherente) {
    html += `<div class="alerta">El SL (${fmt(sl)}) queda ${dir === 'SHORT' ? 'por debajo' : 'por encima'} de la última entrada (${fmt(ultima.precio)}). El SL se tocaría antes de ejecutar la última entrada.</div>`;
  } else if (sl && slCoherente) {
    html += `<div class="ok">El SL (${fmt(sl)}) es coherente con la última entrada (${fmt(ultima.precio)}).</div>`;
  }
  if (distUltimaLiq > 0 && distUltimaLiq < 3) {
    html += `<div class="alerta">La liquidación está a solo ${fmt(distUltimaLiq)}% de la última entrada. Margen muy ajustado.</div>`;
  } else if (distUltimaLiq > 0) {
    html += `<div class="ok">Margen hasta liquidación desde la última entrada: ${fmt(distUltimaLiq)}%.</div>`;
  }
  html += `</div>`;

  const res = document.getElementById('resultado');
  res.innerHTML = html;
  res.classList.add('activo');
  res.scrollIntoView({ behavior: 'smooth' });
}

async function cargarRSI() {
  const cripto = document.getElementById('cripto').value;
  const panel = document.getElementById('rsi-panel');
  const content = document.getElementById('rsi-content');
  const nombre = document.getElementById('rsi-cripto-nombre');
  nombre.textContent = NOMBRES[cripto] || cripto;

  try {
    if (!rsiDataGlobal) {
      const response = await fetch('rsi_data.json?t=' + Date.now());
      rsiDataGlobal = await response.json();
    }
    const data = rsiDataGlobal.data[cripto];
    if (!data) {
      content.innerHTML = '<div class="info">No hay datos de RSI para esta cripto.</div>';
      panel.style.display = 'block';
      return;
    }
    const tfs = ['1h', '4h', '1d', '1w'];
    let html = '';
    tfs.forEach(tf => {
      const valor = data[tf];
      const color = colorRSI(valor);
      const etiqueta = etiquetaRSI(valor);
      const valorStr = (valor === null || valor === undefined) ? '—' : fmt(valor);
      html += `<div class="rsi-row"><span class="rsi-tf">${tf.toUpperCase()}</span><span class="rsi-val" style="color:${color};">${valorStr} <span style="font-size:11px;font-weight:400;">${etiqueta}</span></span></div>`;
    });
    const fecha = rsiDataGlobal.last_update ? new Date(rsiDataGlobal.last_update).toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires' }) : 'Desconocida';
    html += `<div style="margin-top:12px; font-size:11px; color:#484f58;">Última actualización: ${fecha}</div>`;
    content.innerHTML = html;
    panel.style.display = 'block';
  } catch (error) {
    console.log('Error cargando RSI:', error);
    content.innerHTML = '<div class="info">No se pudieron cargar los datos de RSI.</div>';
    panel.style.display = 'block';
  }
}

async function cargarFVG() {
  const cripto = document.getElementById('cripto').value;
  const panel = document.getElementById('fvg-panel');
  const content = document.getElementById('fvg-content');
  const nombre = document.getElementById('fvg-cripto-nombre');
  nombre.textContent = NOMBRES[cripto] || cripto;

  try {
    if (!fvgDataGlobal) {
      const response = await fetch('fvg_data.json?t=' + Date.now());
      fvgDataGlobal = await response.json();
    }
    const data = fvgDataGlobal.data[cripto];
    if (!data) {
      content.innerHTML = '<div class="info">No hay datos de FVG para esta cripto.</div>';
      panel.style.display = 'block';
      return;
    }
    const todosFVG = [];
    ['1h', '4h', '1d'].forEach(tf => {
      const lista = data[tf] || [];
      lista.forEach(fvg => { todosFVG.push({ ...fvg, tf: tf }); });
    });
    if (todosFVG.length === 0) {
      content.innerHTML = '<div class="info">No hay FVG activos para esta cripto.</div>';
      panel.style.display = 'block';
      return;
    }
    const confluencias = detectarConfluencias(todosFVG);
    let html = '';
    if (confluencias.length > 0) {
      html += `<div style="font-size:12px; color:#d29922; font-weight:600; margin-bottom:8px;">🔥 CONFLUENCIAS:</div>`;
      confluencias.forEach(c => {
        const tipoClase = c.tipo === 'alcista' ? 'alcista' : 'bajista';
        const tfsStr = c.tfs.join(' + ').toUpperCase();
        html += `<div class="fvg-confluencia">
          <span class="fvg-tipo ${tipoClase}">${c.tipo.toUpperCase()}</span>
          <span style="font-size:11px; color:#8b949e; margin-left:6px;">[${tfsStr}]</span>
          <div style="font-size:11px; color:#8b949e; margin-top:4px;">${fmtPrecio(c.desde, cripto)} – ${fmtPrecio(c.hasta, cripto)}</div>
          <div class="fvg-precio" style="margin-top:4px;">→ ${fmtPrecio(c.precio, cripto)}</div>
        </div>`;
      });
      html += `<div style="margin-top:12px;"></div>`;
    }
    ['1h', '4h', '1d'].forEach(tf => {
      const lista = data[tf] || [];
      if (lista.length === 0) return;
      html += `<div class="fvg-tf-header">── ${tf.toUpperCase()} (${lista.length}) ──</div>`;
      lista.forEach(fvg => {
        const tipoClase = fvg.tipo === 'alcista' ? 'alcista' : 'bajista';
        const precio = (fvg.desde + fvg.hasta) / 2;
        const confluye = confluencias.some(c => c.tfs.includes(tf) && c.desde <= fvg.hasta && c.hasta >= fvg.desde);
        const estrella = confluye ? ' ⭐' : '';
        html += `<div class="fvg-row">
          <div>
            <span class="fvg-tipo ${tipoClase}">${fvg.tipo.toUpperCase()}</span>
            <span class="fvg-zona" style="margin-left:6px;">${fmtPrecio(fvg.desde, cripto)} – ${fmtPrecio(fvg.hasta, cripto)}${estrella}</span>
          </div>
          <div class="fvg-precio">${fmtPrecio(precio, cripto)}</div>
        </div>`;
      });
    });
    const fecha = fvgDataGlobal.last_update ? new Date(fvgDataGlobal.last_update).toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires' }) : 'Desconocida';
    html += `<div style="margin-top:12px; font-size:11px; color:#484f58;">Última actualización: ${fecha}</div>`;
    content.innerHTML = html;
    panel.style.display = 'block';
  } catch (error) {
    console.log('Error cargando FVG:', error);
    content.innerHTML = '<div class="info">No se pudieron cargar los datos de FVG.</div>';
    panel.style.display = 'block';
  }
}

function detectarConfluencias(fvgs) {
  const confluencias = [];
  for (let i = 0; i < fvgs.length; i++) {
    for (let j = i + 1; j < fvgs.length; j++) {
      const a = fvgs[i];
      const b = fvgs[j];
      if (a.tf === b.tf) continue;
      if (a.tipo !== b.tipo) continue;
      const desde = Math.max(a.desde, b.desde);
      const hasta = Math.min(a.hasta, b.hasta);
      if (desde < hasta) {
        confluencias.push({
          tipo: a.tipo,
          desde: desde,
          hasta: hasta,
          precio: (desde + hasta) / 2,
          tfs: [a.tf, b.tf]
        });
      }
    }
  }
  return confluencias;
}

async function cargarSentimiento() {
  const panel = document.getElementById('sentiment-panel');
  const content = document.getElementById('sentiment-content');
  try {
    const response = await fetch('https://api.alternative.me/fng/?limit=1');
    const data = await response.json();
    if (data && data.data && data.data[0]) {
      const fng = data.data[0];
      const valor = parseInt(fng.value);
      const clasificacion = fng.value_classification;
      let color = '#d29922';
      if (valor <= 24) color = '#f85149';
      else if (valor <= 49) color = '#d29922';
      else if (valor <= 74) color = '#3fb950';
      else color = '#3fb950';
      let interpretacion = '';
      if (valor <= 24) interpretacion = 'Miedo extremo — posible oportunidad';
      else if (valor <= 49) interpretacion = 'Miedo — cautela en el mercado';
      else if (valor <= 74) interpretacion = 'Codicia — confianza en aumento';
      else interpretacion = 'Codicia extrema — posible corrección';
      content.innerHTML = `<div style="display:flex; align-items:center; gap:16px;">
        <div style="font-size:36px; font-weight:700; color:${color}; min-width:70px;">${valor}</div>
        <div>
          <div style="font-size:16px; font-weight:600; color:${color};">${clasificacion}</div>
          <div style="font-size:12px; color:#8b949e; margin-top:4px;">${interpretacion}</div>
        </div>
      </div>
      <div style="margin-top:12px; font-size:11px; color:#484f58;">Fuente: Alternative.me | ${new Date(parseInt(fng.timestamp) * 1000).toLocaleString('es-AR')}</div>`;
      panel.style.display = 'block';
    }
  } catch (error) {
    console.log('Error cargando sentimiento:', error);
  }
}

async function cargarEventos() {
  const panel = document.getElementById('eventos-panel');
  const content = document.getElementById('eventos-content');
  try {
    const response = await fetch('https://biquote.io/api/calendar?importance=high&countries=US');
    const data = await response.json();
    let eventos = [];
    if (Array.isArray(data)) eventos = data;
    else if (data.events) eventos = data.events;
    else if (data.data) eventos = data.data;
    if (eventos.length === 0) {
      content.innerHTML = '<div class="info">No hay eventos de alto impacto esta semana.</div>';
      panel.style.display = 'block';
      return;
    }
    let html = '';
    eventos.slice(0, 6).forEach(ev => {
      const fechaRaw = ev.date || ev.time || ev.datetime;
      let fechaStr = 'Fecha no disponible';
      if (fechaRaw) {
        const d = new Date(fechaRaw);
        fechaStr = d.toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      }
      const nombre = ev.name || ev.title || ev.event || 'Evento';
      const pais = ev.country || ev.currency || 'US';
      html += `<div class="evento"><div class="evento-fecha">${fechaStr} ARG</div><div class="evento-nombre">🔴 ${nombre} (${pais})</div></div>`;
    });
    content.innerHTML = html + `<div style="margin-top:12px; font-size:11px; color:#484f58;">Fuente: Biquote | ${new Date().toLocaleString('es-AR')}</div>`;
    panel.style.display = 'block';
  } catch (error) {
    console.log('Error cargando eventos:', error);
    content.innerHTML = '<div class="info">No se pudieron cargar los eventos. Recargá la página.</div>';
    panel.style.display = 'block';
  }
}
